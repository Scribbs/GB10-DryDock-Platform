# Overlay for local multi-node vLLM (2-node GB10 / DGX Spark cluster)
# Use together with docker-compose.combined.yml
#
# This launches a vLLM head + worker pair that spans both nodes via the QSFP RoCE link.
# Point NV_BASE_URL / VLLM_BASE_URL at http://vllm-head:8000/v1 so the
# vulnerability-analysis blueprint uses the local models instead of cloud NIMs.
#
# Adjust MODEL_ID, tensor-parallel-size, and network interface names for your setup.
# Recommended community images: eugr/spark-vllm-b12x or ghcr.io/timothystewart6/vllm-gb10

x-vllm-common: &vllm-common
  image: ${VLLM_IMAGE:-eugr/spark-vllm-b12x:latest}
  ipc: host
  privileged: true
  shm_size: "16g"
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
    memlock: -1
    stack: 67108864
  volumes:
    - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  networks:
    - default

services:
  vllm-head:
    <<: *vllm-common
    hostname: vllm-head
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:-rocep1s0f1,roceP2p1s0f1}
      - UCX_NET_DEVICES=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - GLOO_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - OMPI_MCA_btl_tcp_if_include=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - VLLM_HOST_IP=${HEAD_QSFP_IP}
      - MASTER_ADDR=${HEAD_QSFP_IP}
      - MASTER_PORT=${MASTER_PORT:-29501}
      - NODE_RANK=0
      - RAY_HEAD=1
    command: >
      vllm serve ${MODEL_ID:-nvidia/Qwen3.8-27B-NVFP4}
        --host 0.0.0.0
        --port 8000
        --tensor-parallel-size 2
        --distributed-executor-backend ray
        --gpu-memory-utilization 0.75
        --max-model-len 32768
        --kv-cache-dtype fp8
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code

  vllm-worker:
    <<: *vllm-common
    hostname: vllm-worker
    depends_on:
      - vllm-head
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - NCCL_IB_DISABLE=0
      - NCCL_IB_HCA=${NCCL_IB_HCA:-rocep1s0f1,roceP2p1s0f1}
      - UCX_NET_DEVICES=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - GLOO_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - TP_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - OMPI_MCA_btl_tcp_if_include=${NCCL_SOCKET_IFNAME:-enp1s0f1np1}
      - VLLM_HOST_IP=${WORKER_QSFP_IP}
      - MASTER_ADDR=${HEAD_QSFP_IP}
      - MASTER_PORT=${MASTER_PORT:-29501}
      - NODE_RANK=1
    command: >
      ray start --address=${HEAD_QSFP_IP}:6379 --block
